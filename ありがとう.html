<!DOCTYPE html>

<title>お申し込み受付｜Lily Ballet Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#fffaf7;
  color:#765e64;
  font-family:'Yu Mincho','Hiragino Mincho ProN',serif;
}
main{
  min-height:100svh;
  max-width:520px;
  margin:0 auto;
  padding:20px 20px 18px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.brand-lily{
  font:italic 42px/1 Georgia,serif;
  color:#b87886;
}
.brand-sub{
  font-family:Georgia,serif;
  letter-spacing:.16em;
  font-size:14px;
  color:#b87886;
  margin-top:3px;
  line-height:1.3;
}
.brand-ja{
  font-size:13px;
  color:#987980;
  margin-top:2px;
  line-height:1.4;
}
h1{
  font-weight:400;
  font-size:22px;
  line-height:1.5;
  color:#b87886;
  margin:20px 0 10px;
}
p{
  margin:7px 0;
  line-height:1.75;
  font-size:15px;
}
.notice{
  margin-top:10px;
}
small{
  color:#987980;
  font-size:12px;
  line-height:1.65;
}
a{
  display:inline-block;
  align-self:center;
  margin-top:14px;
  background:#b87886;
  color:#fff;
  text-decoration:none;
  border-radius:40px;
  padding:10px 26px;
  line-height:1.4;
  font-size:14px;
}
@media (max-height:700px){
  main{padding-top:12px;padding-bottom:12px}
  .brand-lily{font-size:38px}
  h1{font-size:20px;margin-top:15px;margin-bottom:7px}
  p{font-size:14px;line-height:1.6;margin:5px 0}
  small{font-size:11px;line-height:1.5}
  a{margin-top:10px;padding:9px 24px}

</head>
<body>
<main>
  <div class="brand-lily">Lily</div>

  折り返しご案内いたします。</p>

  <p class="notice"><small>
